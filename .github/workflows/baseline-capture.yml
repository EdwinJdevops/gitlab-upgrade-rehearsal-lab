name: baseline-capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/capture-baseline.sh
      - .github/workflows/baseline-capture.yml

permissions:
  contents: read

concurrency:
  group: baseline-capture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture exact mutable GitLab baseline inputs
        run: bash scripts/capture-baseline.sh baseline-capture

      - name: Emit manifest for evidence review
        if: always()
        run: |
          if [[ -f baseline-capture/manifest.tsv ]]; then
            echo '--- baseline-capture/manifest.tsv ---'
            cat baseline-capture/manifest.tsv
          fi
